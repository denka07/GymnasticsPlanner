# Runs the Playwright browser tests (e2e/) on every pull request.
#
# The tests run against `next dev` with the development sign-in, on a
# throwaway Neon branch made from `dev` (so the test users, with Dev Coach as
# administrator, already exist). Pending migrations are applied to that branch
# first, and it is deleted when the run ends. Production is never touched.
#
# Needs the repository variables NEON_PROJECT_ID and NEON_AUTH_BASE_URL and the
# secret NEON_API_KEY.
name: Browser tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The same major version as local development, whose npm wrote the lock file.
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Create a database branch for this run
        id: db
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: dev
          branch_name: ci/e2e-${{ github.run_id }}-${{ github.run_attempt }}
          role: neondb_owner
          database: neondb
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply migrations to the branch
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ steps.db.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.db.outputs.db_url }}

      - name: Run the browser tests
        run: |
          # A cookie secret for this run only; the development sign-in never uses it.
          export NEON_AUTH_COOKIE_SECRET="$(openssl rand -hex 32)"
          npm run test:e2e
        env:
          CI: "true"
          DATABASE_URL: ${{ steps.db.outputs.db_url_pooled }}
          DEV_SIGN_IN_EMAIL: dev@example.test
          NEON_AUTH_BASE_URL: ${{ vars.NEON_AUTH_BASE_URL }}

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Delete the database branch
        if: always() && steps.db.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.db.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
